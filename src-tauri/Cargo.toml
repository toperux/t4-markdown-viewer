[package]
name = "t4-markdown-viewer"
version = "1.7.3"
edition = "2021"
description = "A fast, themeable Markdown viewer"
authors = ["Christopher Montevirgen"]
license = "MIT"
repository = "https://github.com/toperux/t4-markdown-viewer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
comrak = "0.55"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }

# drive-app on macOS: an in-app WebDriver server. Never in a release build.
[features]
webdriver = ["dep:tauri-plugin-webdriver"]

# `tauri::test`'s mock runtime, for driving window routing without a real
# webview. Tests only: resolver 2 keeps the feature out of `cargo build`.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Tab drags need the window actually under the cursor, which only the
# compositor knows. Tauri exposes no z-order, so hit-testing calls
# WindowFromPoint directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# A window's size as GTK has it — see `session::gtk_read`. Already in the tree
# through tauri; this only makes it direct.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
