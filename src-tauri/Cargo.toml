[package]
name = "t4-markdown-viewer"
version = "0.1.0"
edition = "2021"
description = "A fast, themeable Markdown viewer for Windows"
authors = ["Christopher Montevirgen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
comrak = "0.54"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-opener = "2.5.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
