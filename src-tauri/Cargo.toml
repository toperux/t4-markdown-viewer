[package]
name = "t4-markdown-viewer"
version = "1.5.1"
edition = "2021"
description = "A fast, themeable Markdown viewer"
authors = ["Christopher Montevirgen"]
license = "MIT"
repository = "https://github.com/toperux/t4-markdown-viewer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
comrak = "0.54"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2"

# Tab drags need the window actually under the cursor, which only the
# compositor knows. Tauri exposes no z-order, so hit-testing calls
# WindowFromPoint directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
