version: 2
updates:
  # Workflow actions are pinned to commits; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # `ci:` keeps these bumps off the release page, which is built from commit
    # subjects and drops that prefix. Dependabot adds the colon itself.
    commit-message:
      prefix: ci

  # The Rust tree is the whole app; without this it never gets bumped and a
  # security advisory against a transitive crate goes unnoticed.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # `chore:` is dropped from the release page for the same reason as `ci:`
    # above. Dependabot adds the colon itself.
    commit-message:
      prefix: chore
    # One PR for the lot: these bumps share a Cargo.lock, so separate PRs would
    # conflict with each other and each need a rebase to go green.
    groups:
      cargo:
        patterns:
          - "*"
