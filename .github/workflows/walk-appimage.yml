name: Walk AppImage

# For the walk of docs/plans/appimage-child-environment.md only. This file
# lives on walk/appimage-env and never reaches main.
#
# The fault the walk tests needs an image built where a release is: the bundle
# carries the build machine's libsystemd, and only ubuntu-22.04's is too old
# for a newer host's /usr/bin/env. Built as 1.9.0, so it takes the real 1.9.1
# update. No environment and no secrets: the updater artefacts are off, so the
# signing key is not asked for.
on:
  push:
    branches: [walk/appimage-env]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WALK_CONFIG: '{"version":"1.9.0","bundle":{"createUpdaterArtifacts":false}}'

jobs:
  appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # The Linux-only code is compiled nowhere before this run.
      - name: Format
        run: cargo fmt --check

      - name: Frontend syntax
        run: |
          node --check ../src/app.js
          node --check ../src/diagram-frame.js

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.1 --locked

      # As release.yml does, in two steps, so that the download guard below
      # reads the bundler's log and not cargo's.
      - name: Build the app
        run: cargo tauri build --no-bundle --config "$WALK_CONFIG" -- --locked

      # release.yml's step, as it stands there.
      - name: Pin the AppImage tools
        shell: bash
        run: |
          set -euo pipefail
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$dir"
          fetch() {
            curl -fsSL --retry 3 -o "$dir/$1" "$2"
            echo "$3  $dir/$1" | sha256sum -c -
            chmod 770 "$dir/$1"
          }
          rel=https://github.com
          fetch AppRun-x86_64 $rel/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          fetch linuxdeploy-07333c6-x86_64.AppImage $rel/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
          fetch linuxdeploy-plugin-appimage.AppImage $rel/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
          fetch runtime-x86_64 $rel/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          echo "LDAI_RUNTIME_FILE=$dir/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri bundle --bundles appimage --config "$WALK_CONFIG" 2>&1 | tee "$RUNNER_TEMP/bundle.log"
          # Every AppImage tool is pinned in "Pin the AppImage tools".
          if grep -q Downloading "$RUNNER_TEMP/bundle.log"; then
            echo "bundler downloaded a tool the pins do not cover" >&2; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
